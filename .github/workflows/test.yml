name: test
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[dev]'
      - name: Unit and integration tests
        run: pytest -q
      - name: CLI smoke test
        run: signalforge demo --seed 42 > /tmp/signalforge-demo.json
      - name: Validate CLI output
        run: python -c "import json; d=json.load(open('/tmp/signalforge-demo.json')); assert d['fingerprint']['dominant_feature']; assert d['health']['status'] in {'healthy','watch','critical'}"
